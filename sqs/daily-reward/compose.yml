services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - SQS_URL=http://localstack:4566/000000000000/daily-reward
      - PYTHONUNBUFFERED=1

  worker:
    build: ./worker
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - SQS_URL=http://localstack:4566/000000000000/daily-reward
      - PYTHONUNBUFFERED=1
    
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh"