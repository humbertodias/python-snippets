services:

  api:
    build: app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      localstack:
        condition: service_healthy

  worker:
    build: worker
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      localstack:
        condition: service_healthy

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sqs
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./init.sh:/etc/localstack/init/ready.d/init.sh"